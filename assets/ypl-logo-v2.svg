<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Youth Puzzle League strong YPL logo</title>
  <desc id="desc">A strong green, gold, and blue YPL league mark with puzzle-tile accents.</desc>
  <defs>
    <linearGradient id="badgeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#254634"/>
      <stop offset="0.56" stop-color="#315d7f"/>
      <stop offset="1" stop-color="#1f2f3a"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d77f"/>
      <stop offset="1" stop-color="#c79b37"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16130f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="28" y="24" width="704" height="212" rx="34" fill="#fbfaf7"/>
    <rect x="42" y="38" width="676" height="184" rx="26" fill="#ffffff" stroke="#ddd7cc" stroke-width="3"/>
  </g>

  <g transform="translate(66 48)">
    <rect x="0" y="0" width="164" height="164" rx="30" fill="url(#badgeGradient)"/>
    <path d="M28 32h108a12 12 0 0 1 12 12v76a12 12 0 0 1-12 12h-27c-4 0-7 3-7 7 0 9.4-7.6 17-17 17s-17-7.6-17-17c0-4-3-7-7-7H28a12 12 0 0 1-12-12V44a12 12 0 0 1 12-12Z" fill="url(#goldGradient)"/>
    <path d="M42 50h80a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H42a8 8 0 0 1-8-8V58a8 8 0 0 1 8-8Z" fill="#ffffff" opacity="0.14"/>
    <text x="82" y="103" fill="#ffffff" stroke="#1f2f3a" stroke-width="3" paint-order="stroke" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="950" text-anchor="middle" letter-spacing="0">YPL</text>
  </g>

  <g transform="translate(260 71)">
    <text x="0" y="68" fill="#232323" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="950" letter-spacing="0">YPL</text>
    <text x="1" y="112" fill="#254634" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="850" letter-spacing="0">Youth Puzzle League</text>
    <text x="2" y="146" fill="#68635b" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="0">weekly quorum challenges</text>
    <rect x="0" y="166" width="78" height="10" rx="5" fill="#c9a34d"/>
    <rect x="90" y="166" width="78" height="10" rx="5" fill="#315d7f"/>
    <rect x="180" y="166" width="78" height="10" rx="5" fill="#3d6f50"/>
  </g>

  <g transform="translate(626 64)" opacity="0.96">
    <rect x="0" y="0" width="30" height="30" rx="7" fill="#e8f1dd" stroke="#c9dda9" stroke-width="2"/>
    <rect x="38" y="0" width="30" height="30" rx="7" fill="#fff4cf" stroke="#e8d38d" stroke-width="2"/>
    <rect x="0" y="38" width="30" height="30" rx="7" fill="#e5eff6" stroke="#bfd2e2" stroke-width="2"/>
    <rect x="38" y="38" width="30" height="30" rx="7" fill="#f4e6e3" stroke="#e5c6c0" stroke-width="2"/>
  </g>
</svg>
