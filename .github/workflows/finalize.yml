name: Finalize weekly leaderboard

# Runs daily and finalizes any puzzle whose deadline (closesAt) has passed and
# that has not been finalized yet, then commits the leaderboard JSON. You can
# also trigger it by hand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily (after the Sun-night deadline)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Finalize any closed weeks
        env:
          PQ_GOOGLE_SCRIPT_URL: ${{ secrets.PQ_GOOGLE_SCRIPT_URL }}
          PQ_ADMIN_KEY: ${{ secrets.PQ_ADMIN_KEY }}
        run: node scripts/finalize-week.mjs --auto

      - name: Commit and push if the leaderboard changed
        run: |
          if [[ -n "$(git status --porcelain data/leaderboards)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/leaderboards
            git commit -m "Auto-finalize weekly leaderboard"
            git push
          else
            echo "No leaderboard changes to publish."
          fi
