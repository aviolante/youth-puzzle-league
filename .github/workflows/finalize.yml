name: Weekly leaderboard preview

# After each week's Saturday-midnight (ET) deadline, this pulls the scores and
# prints the would-be standings for review — it does NOT change the repo. You
# review, then publish yourself by running the finalizer locally:
#   PQ_GOOGLE_SCRIPT_URL=... PQ_ADMIN_KEY=... npm run finalize:week -- --auto
#   git add data/leaderboards && git commit -m "Publish week" && git push
on:
  schedule:
    - cron: "0 13 * * 0" # Sundays 13:00 UTC, after the Sat-night ET deadline
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preview standings (no changes pushed)
        env:
          PQ_GOOGLE_SCRIPT_URL: ${{ secrets.PQ_GOOGLE_SCRIPT_URL }}
          PQ_ADMIN_KEY: ${{ secrets.PQ_ADMIN_KEY }}
        run: |
          node scripts/finalize-week.mjs --auto --dry-run | tee /tmp/preview.txt
          {
            echo "## Weekly leaderboard preview (not published)"
            echo "Review these, then run \`npm run finalize:week -- --auto\` locally and push to publish."
            echo '```json'
            cat /tmp/preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
